# Server
server.port=8080

# H2 in-memory database (dev)
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS — allow the React dev server
cors.allowed-origins=http://localhost:5173

# ---------------------------------------------------------------------------
# Redis cache
# ---------------------------------------------------------------------------
# Note the 'spring.data.redis' prefix, not 'spring.redis' — it moved in Boot 3.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Keep these short. RedisCache degrades to a cache miss on failure, but it can only do
# that once the call gives up — a long timeout turns "Redis is down" into "every request
# is slow" rather than "the cache is skipped".
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Pooling requires commons-pool2 on the classpath (see pom.xml).
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Prefix on every key this application writes, so eviction-by-prefix and any SCAN can
# never touch another service's keys on a shared Redis instance.
app.cache.namespace=learning-java
# The 5-minute window used by the catalog example. Accepts any Duration: 30s, 5m, 1h.
app.cache.default-ttl=5m
# Must exceed the slowest expected loader, or the single-flight lock expires mid-load.
app.cache.lock-ttl=10s

# Value read-back on GET /api/cache/{key}. Off by default: the caller chooses the key,
# and cached keys routinely hold tokens and personal data. The /match endpoints compare
# without revealing anything, so leave this off outside local debugging.
app.cache.lookup.expose-values=false

# Artificial query delay so the cache's effect is measurable against H2, which is
# otherwise too fast to see. Set to 0 to disable.
app.catalog.simulated-latency-ms=400

# Uncomment to see every Redis command the application issues.
# logging.level.org.springframework.data.redis=DEBUG

# Camel
camel.springboot.name=learning-integration
logging.level.org.apache.camel=INFO

# REST DSL config. Deliberately here rather than in a restConfiguration() inside
# a RouteBuilder: RouteBuilder load order is not guaranteed, so a RouteBuilder
# that happens to load BEFORE the one holding restConfiguration() silently gets
# the defaults instead. Properties are applied before any route is built.

# Reuse the servlet container Spring Boot already started, so Camel routes and
# HelloController share port 8080.
camel.rest.component=platform-http
# Everything lands under /camel/* — clear of the existing /api/*
camel.rest.context-path=/camel
# 'off' means we marshal explicitly with .marshal().json() in each route.
# 'json' is more concise but silently re-encodes an already-JSON string body.
camel.rest.binding-mode=off
# Camel 4 defaults this to TRUE, which fuses each rest(...) route into the
# direct: route it calls, leaving no independently addressable direct: endpoint —
# so tests sending to "direct:hello" fail with DirectConsumerNotAvailable.
camel.rest.inline-routes=false

# Outbound targets. Camel resolves these with {{...}} (double braces),
# which is Camel's placeholder syntax, not Spring's ${...}.
github.base-url=https://api.github.com
github.connect-timeout-ms=5000
